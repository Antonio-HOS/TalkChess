# Limita requisiÃ§Ãµes por IP (ajuda contra forÃ§a bruta na senha). Os assets entram no "burst".
limit_req_zone $binary_remote_addr zone=talkchess:10m rate=20r/s;

server {
    listen 3002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # CabeÃ§alhos de seguranÃ§a. Os locations abaixo usam "expires" (e nÃ£o add_header)
    # justamente para que estes cabeÃ§alhos continuem valendo em todos eles.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microfone liberado apenas para o prÃ³prio site
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # ProteÃ§Ã£o por senha (HTTP Basic) em todo o site, exceto /healthz
    auth_basic "TalkChess";
    auth_basic_user_file /tmp/.htpasswd;
    limit_req zone=talkchess burst=100 nodelay;

    # Healthcheck do Docker (sem senha)
    location = /healthz {
        auth_basic off;
        limit_req zone=talkchess;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache longo
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Motor Stockfish (nome fixo): cache de 1 dia
    location /stockfish/ {
        expires 1d;
        types {
            application/wasm wasm;
            application/javascript js;
        }
        try_files $uri =404;
    }

    # index.html nunca em cache, para sempre pegar a versÃ£o nova
    location = /index.html {
        expires -1;
    }
}
