version: '3.8'

services:
  # Frontend TalkChess (Vite + Nginx)
  talkchess:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talkchess
    restart: unless-stopped
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Defina APP_PASSWORD no arquivo .env}
    ports:
      - "${TALKCHESS_PORT:-3002}:3002"
    networks:
      - talkchess-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  talkchess-network:
    driver: bridge
